name: collect
on:
  schedule:
    - cron: '0 19 * * 0'   # 월요일 04:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # 수집에 실패한 장소는 지난 게시본을 그대로 쓰도록 먼저 받아 둔다
      - name: 지난 게시본 받기
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone -q --depth 1 --branch gh-pages "https://github.com/${{ github.repository }}.git" prev
            cp -r prev/v1 out/ 2>/dev/null || true
            cp prev/summary.json out/ 2>/dev/null || true
          fi

      - name: 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python build.py

      - name: 검증
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python check.py

      - name: gh-pages 강제 게시 (이력 없음)
        run: |
          rm -rf site && mkdir site
          cp -r out/v1 site/v1
          cp out/summary.json site/summary.json
          [ -d privacy ] && cp -r privacy site/privacy || true
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "pin-data-bot"
          git config user.email "pin-data-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
